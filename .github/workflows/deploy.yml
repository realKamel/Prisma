name: Build and Push Publish Branch

on:
  push:
    branches: [ main ] # Runs automatically whenever code is pushed to main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Publish Web App
        run: dotnet publish -c Release -o ./publish

      - name: Deploy Compiled Files to Release Branch
        uses: Peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: release # This is the branch MonsterASP will pull from
          force_orphan: true # Keeps the branch clean by replacing old build commits