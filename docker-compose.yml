services:
  prisma.api:
    image: ${DOCKER_REGISTRY-}prismaapi
    build:
      context: .
      dockerfile: Prisma.API/Dockerfile
    environment:
      ConnectionStrings__DefaultSqlConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=true;SSL Mode=Disable;"
      ConnectionStrings__DefaultSqlConnection2: "Host=connection-pooler;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};No Reset On Close=true;Max Auto Prepare=0;Include Error Detail=true;SSL Mode=Disable;"
      ConnectionStrings__Valkey: "cache:6379"
      IdentitySeed__AdminEmail: ${IDENTITY_SEED_ADMIN_EMAIL}
      IdentitySeed__AdminPassword: ${IDENTITY_SEED_ADMIN_PASSWORD}
      IdentitySeed__AdminPhone: ${IDENTITY_SEED_ADMIN_PHONE_NUMBER}
      ObjectStorage__ServiceUrl: ${S3_ENDPOINT}
      ObjectStorage__AccessKey: ${S3_ACCESS_KEY_ID}
      ObjectStorage__SecretKey: ${S3_SECRET_ACCESS_KEY}
      ObjectStorage__BucketName: ${S3_BUCKET_NAME}
      ObjectStorage__Region: ${S3_BUCKET_REGION}
      ObjectStorage__ForcePathStyle: ${S3_BUCKET_FORCE_PATH_STYLE}
      PaymobSettings__SecretKey: ${PAYMOB_SECRET_KEY}
      PaymobSettings__RedirectionUrl: ${PAYMOB_REDIRECTION_URL}
      PaymobSettings__PublicKey: ${PAYMOB_PUBLIC_KEY}
      PaymobSettings__NotificationUrl: ${PAYMOB_NOTIFICATION_URL}
      PaymobSettings__IframeId: ${PAYMOB_IFRAME_ID}
      PaymobSettings__HmacSecret: ${PAYMOB_HMAC_SECRET}
      PaymobSettings__FawryIntegrationId: ${PAYMOB_FAWRY_INTEGRATION_ID}
      PaymobSettings__CardIntegrationId: ${PAYMOB_CARD_INTEGRATION_ID}
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
      Groq__ApiKey: ${GROQ_API_KEY}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    mem_limit: 3072m
    
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      connection-pooler:
        condition: service_started

  db:
    image: pgvector/pgvector:pg18
    container_name: prisma-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 3072m
    restart: unless-stopped

  cache:
    image: valkey/valkey:latest
    container_name: prisma-cache
    volumes:
      - cache-data:/data
    command: ["valkey-server", "--maxmemory", "900mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 1024m
    restart: unless-stopped

  connection-pooler:
    image: edoburu/pgbouncer:latest
    container_name: prisma-pgbouncer
    environment:
      DB_HOST: ${PGBOUNCER_DB_HOST}
      DB_PORT: ${PGBOUNCER_DB_PORT}
      DB_USER: ${PGBOUNCER_DB_USER}
      DB_PASSWORD: ${PGBOUNCER_DB_PASSWORD}
      DB_NAME: ${PGBOUNCER_DB_NAME}
      POOL_MODE: ${PGBOUNCER_POOL_MODE}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE}
      ADMIN_USERS: ${PGBOUNCER_ADMIN_USERS}
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped

volumes:
  postgres-data:
  cache-data:
